[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vs-finance-agent-sdk"
version = "0.1.0"
description = "Python SDK for the Finance Agent API (chat & file management)"
readme = "README.md"
license = { text = "MIT" }
keywords = ["finance-agent", "sdk", "api", "websocket"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["finance_agent_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
