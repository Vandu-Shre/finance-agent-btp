name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "sdk/**"
      - "python-sdk/**"
      - "package*.json"

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            sdk/package-lock.json

      - name: Install Node.js dependencies for frontend
        run: |
          npm ci --prefix frontend

      - name: Install Node.js dependencies for backend
        run: |
          npm ci --prefix backend

      - name: Install Node.js dependencies for sdk
        run: |
          npm ci --prefix sdk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx websockets pytest pytest-asyncio pytest-cov
        working-directory: python-sdk

      - name: Run frontend tests with coverage
        run: npm run test:coverage --prefix frontend

      - name: Check frontend coverage thresholds
        run: |
          cd frontend
          LINES=$(node -e "
            const coverage = require('./coverage/coverage-summary.json');
            console.log(coverage.total.lines.pct);
          ")
          echo "Frontend line coverage: $LINES%"

          THRESHOLD=85
          if (( $(echo "$LINES < $THRESHOLD" | bc -l) )); then
            echo "❌ Frontend line coverage ($LINES%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          echo "✅ Frontend line coverage meets threshold (${THRESHOLD}%)"

      - name: Run backend tests with coverage
        run: npm run test:coverage --prefix backend

      - name: Check backend coverage thresholds
        run: |
          cd backend
          LINES=$(node -e "
            const coverage = require('./coverage/coverage-summary.json');
            console.log(coverage.total.lines.pct);
          ")
          echo "Backend line coverage: $LINES%"

          THRESHOLD=85
          if (( $(echo "$LINES < $THRESHOLD" | bc -l) )); then
            echo "❌ Backend line coverage ($LINES%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          echo "✅ Backend line coverage meets threshold (${THRESHOLD}%)"

      - name: Run SDK tests with coverage
        run: npm run test:coverage --prefix sdk

      - name: Check SDK coverage thresholds
        run: |
          cd sdk
          LINES=$(node -e "
            const coverage = require('./coverage/coverage-summary.json');
            console.log(coverage.total.lines.pct);
          ")
          echo "SDK line coverage: $LINES%"

          THRESHOLD=85
          if (( $(echo "$LINES < $THRESHOLD" | bc -l) )); then
            echo "❌ SDK line coverage ($LINES%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          echo "✅ SDK line coverage meets threshold (${THRESHOLD}%)"

      - name: Run Python SDK tests with coverage
        run: python -m pytest tests/ --cov=finance_agent_sdk --cov-report=json --cov-report=term
        working-directory: python-sdk

      - name: Check Python SDK coverage threshold
        run: |
          cd python-sdk
          COVERAGE=$(python3 -c "
          import json
          with open('coverage.json') as f:
              data = json.load(f)
          print(data['totals']['percent_covered'])
          ")
          THRESHOLD=85
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Python SDK coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          echo "✅ Python SDK coverage meets threshold (${THRESHOLD}%)"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            frontend/coverage/
            backend/coverage/
            sdk/coverage/
            python-sdk/coverage.json
          retention-days: 7

      - name: Comment PR with coverage summary
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');

            function getJsCoverage(path) {
              try {
                const summary = JSON.parse(fs.readFileSync(`${path}/coverage/coverage-summary.json`, 'utf8'));
                return summary.total;
              } catch (e) {
                return null;
              }
            }

            function getPythonCoverage(path) {
              try {
                const data = JSON.parse(fs.readFileSync(path, 'utf8'));
                return data.totals;
              } catch (e) {
                return null;
              }
            }

            const frontend = getJsCoverage('frontend');
            const backend = getJsCoverage('backend');
            const sdk = getJsCoverage('sdk');
            const pythonSdk = getPythonCoverage('python-sdk/coverage.json');

            const formatJsCoverage = (cov) => {
              if (!cov) return 'N/A';
              return `${cov.lines.pct}%`;
            };

            const formatPythonCoverage = (cov) => {
              if (!cov) return 'N/A';
              return `${cov.percent_covered.toFixed(1)}%`;
            };

            const threshold = 85;
            const jsCheck = (cov) => cov ? (cov.lines.pct >= threshold ? '✅' : '❌') : 'N/A';
            const pyCheck = (cov) => cov ? (cov.percent_covered >= threshold ? '✅' : '❌') : 'N/A';

            const warnings = [
              frontend && frontend.lines.pct < threshold ? '⚠️ Frontend line coverage below threshold' : '',
              backend && backend.lines.pct < threshold ? '⚠️ Backend line coverage below threshold' : '',
              sdk && sdk.lines.pct < threshold ? '⚠️ SDK line coverage below threshold' : '',
              pythonSdk && pythonSdk.percent_covered < threshold ? '⚠️ Python SDK line coverage below threshold' : '',
            ].filter(Boolean).join('\n');

            const comment = `## 📊 Code Coverage Report (Lines)

            | Component | Line Coverage | Status |
            |-----------|---------------|--------|
            | Frontend | ${formatJsCoverage(frontend)} | ${jsCheck(frontend)} |
            | Backend | ${formatJsCoverage(backend)} | ${jsCheck(backend)} |
            | SDK (npm) | ${formatJsCoverage(sdk)} | ${jsCheck(sdk)} |
            | Python SDK | ${formatPythonCoverage(pythonSdk)} | ${pyCheck(pythonSdk)} |

            **Minimum Required Line Coverage:** ${threshold}%
            ${warnings ? '\n' + warnings : ''}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            sdk/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
          npm ci --prefix sdk

      - name: Run ESLint on frontend
        run: npm run lint --prefix frontend
        continue-on-error: true

      - name: Run ESLint on backend
        run: npm run lint --prefix backend
        continue-on-error: true

      - name: Run ESLint on SDK
        run: npm run lint --prefix sdk
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test-and-coverage]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            sdk/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
          npm ci --prefix sdk

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Build SDK
        run: npm run build --prefix sdk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python SDK
        run: |
          pip install build
          python -m build
        working-directory: python-sdk
