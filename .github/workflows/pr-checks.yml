name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'sdk/**'
      - 'python-sdk/**'
      - 'package*.json'

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            sdk/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
          npm ci --prefix sdk

      - name: Run frontend tests with coverage
        run: npm run test:coverage --prefix frontend

      - name: Check frontend coverage thresholds
        run: |
          cd frontend
          COVERAGE=$(node -e "
            const coverage = require('./coverage/coverage-summary.json');
            const total = coverage.total;
            const lines = total.lines.pct;
            const statements = total.statements.pct;
            const functions = total.functions.pct;
            const branches = total.branches.pct;
            console.log(JSON.stringify({ lines, statements, functions, branches }));
          ")
          echo "Frontend Coverage: $COVERAGE"

          LINES=$(echo $COVERAGE | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf-8')).lines)")
          STATEMENTS=$(echo $COVERAGE | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf-8')).statements)")
          FUNCTIONS=$(echo $COVERAGE | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf-8')).functions)")
          BRANCHES=$(echo $COVERAGE | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf-8')).branches)")

          THRESHOLD=50
          if (( $(echo "$LINES < $THRESHOLD" | bc -l) )); then
            echo "❌ Frontend line coverage ($LINES%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          if (( $(echo "$STATEMENTS < $THRESHOLD" | bc -l) )); then
            echo "❌ Frontend statement coverage ($STATEMENTS%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          if (( $(echo "$FUNCTIONS < $THRESHOLD" | bc -l) )); then
            echo "❌ Frontend function coverage ($FUNCTIONS%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          if (( $(echo "$BRANCHES < $THRESHOLD" | bc -l) )); then
            echo "❌ Frontend branch coverage ($BRANCHES%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          echo "✅ Frontend coverage meets all thresholds (${THRESHOLD}%)"

      - name: Run backend tests with coverage
        run: npm run test:coverage --prefix backend

      - name: Check backend coverage thresholds
        run: |
          cd backend
          COVERAGE=$(node -e "
            const coverage = require('./coverage/coverage-summary.json');
            const total = coverage.total;
            const lines = total.lines.pct;
            const statements = total.statements.pct;
            const functions = total.functions.pct;
            const branches = total.branches.pct;
            console.log(JSON.stringify({ lines, statements, functions, branches }));
          ")
          echo "Backend Coverage: $COVERAGE"

          LINES=$(echo $COVERAGE | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf-8')).lines)")
          STATEMENTS=$(echo $COVERAGE | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf-8')).statements)")
          FUNCTIONS=$(echo $COVERAGE | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf-8')).functions)")
          BRANCHES=$(echo $COVERAGE | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf-8')).branches)")

          THRESHOLD=50
          if (( $(echo "$LINES < $THRESHOLD" | bc -l) )); then
            echo "❌ Backend line coverage ($LINES%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          if (( $(echo "$STATEMENTS < $THRESHOLD" | bc -l) )); then
            echo "❌ Backend statement coverage ($STATEMENTS%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          if (( $(echo "$FUNCTIONS < $THRESHOLD" | bc -l) )); then
            echo "❌ Backend function coverage ($FUNCTIONS%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          if (( $(echo "$BRANCHES < $THRESHOLD" | bc -l) )); then
            echo "❌ Backend branch coverage ($BRANCHES%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          echo "✅ Backend coverage meets all thresholds (${THRESHOLD}%)"

      - name: Run SDK tests with coverage
        run: npm run test:coverage --prefix sdk

      - name: Check SDK coverage thresholds
        run: |
          cd sdk
          COVERAGE=$(node -e "
            const coverage = require('./coverage/coverage-summary.json');
            const total = coverage.total;
            const lines = total.lines.pct;
            const statements = total.statements.pct;
            const functions = total.functions.pct;
            const branches = total.branches.pct;
            console.log(JSON.stringify({ lines, statements, functions, branches }));
          ")
          echo "SDK Coverage: $COVERAGE"

          LINES=$(echo $COVERAGE | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf-8')).lines)")
          STATEMENTS=$(echo $COVERAGE | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf-8')).statements)")
          FUNCTIONS=$(echo $COVERAGE | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf-8')).functions)")
          BRANCHES=$(echo $COVERAGE | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf-8')).branches)")

          THRESHOLD=50
          if (( $(echo "$LINES < $THRESHOLD" | bc -l) )); then
            echo "❌ SDK line coverage ($LINES%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          if (( $(echo "$STATEMENTS < $THRESHOLD" | bc -l) )); then
            echo "❌ SDK statement coverage ($STATEMENTS%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          if (( $(echo "$FUNCTIONS < $THRESHOLD" | bc -l) )); then
            echo "❌ SDK function coverage ($FUNCTIONS%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          if (( $(echo "$BRANCHES < $THRESHOLD" | bc -l) )); then
            echo "❌ SDK branch coverage ($BRANCHES%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          echo "✅ SDK coverage meets all thresholds (${THRESHOLD}%)"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            frontend/coverage/
            backend/coverage/
            sdk/coverage/
          retention-days: 7

      - name: Comment PR with coverage summary
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');

            function getCoverage(path) {
              try {
                const summary = JSON.parse(fs.readFileSync(`${path}/coverage/coverage-summary.json`, 'utf8'));
                return summary.total;
              } catch (e) {
                return null;
              }
            }

            const frontend = getCoverage('frontend');
            const backend = getCoverage('backend');
            const sdk = getCoverage('sdk');

            const formatCoverage = (cov) => {
              if (!cov) return 'N/A';
              return `Lines: ${cov.lines.pct}% | Statements: ${cov.statements.pct}% | Functions: ${cov.functions.pct}% | Branches: ${cov.branches.pct}%`;
            };

            const threshold = 50;
            const checkMark = (pct) => pct >= threshold ? '✅' : '❌';

            const comment = `## 📊 Code Coverage Report

            | Component | Coverage | Status |
            |-----------|----------|--------|
            | Frontend | ${formatCoverage(frontend)} | ${frontend ? checkMark(frontend.lines.pct) : 'N/A'} |
            | Backend | ${formatCoverage(backend)} | ${backend ? checkMark(backend.lines.pct) : 'N/A'} |
            | SDK | ${formatCoverage(sdk)} | ${sdk ? checkMark(sdk.lines.pct) : 'N/A'} |

            **Minimum Required Coverage:** ${threshold}%

            ${frontend && frontend.lines.pct < threshold ? '⚠️ Frontend coverage below threshold\n' : ''}
            ${backend && backend.lines.pct < threshold ? '⚠️ Backend coverage below threshold\n' : ''}
            ${sdk && sdk.lines.pct < threshold ? '⚠️ SDK coverage below threshold\n' : ''}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            sdk/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
          npm ci --prefix sdk

      - name: Run ESLint on frontend
        run: npm run lint --prefix frontend
        continue-on-error: true

      - name: Run ESLint on backend
        run: npm run lint --prefix backend
        continue-on-error: true

      - name: Run ESLint on SDK
        run: npm run lint --prefix sdk
        continue-on-error: true

  test-python-sdk:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx websockets pytest pytest-asyncio pytest-cov
        working-directory: python-sdk

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=finance_agent_sdk --cov-report=json --cov-report=term
        working-directory: python-sdk

      - name: Check coverage threshold
        run: |
          cd python-sdk
          COVERAGE=$(python3 -c "
          import json
          with open('coverage.json') as f:
              data = json.load(f)
          print(data['totals']['percent_covered'])
          ")
          THRESHOLD=50
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Python SDK coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
            exit 1
          fi
          echo "✅ Python SDK coverage meets threshold (${THRESHOLD}%)"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-coverage
          path: python-sdk/coverage.json
          retention-days: 7

      - name: Comment PR with Python SDK coverage
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');

            let coverageText = 'N/A';
            let status = 'N/A';
            const threshold = 50;

            try {
              const data = JSON.parse(fs.readFileSync('python-sdk/coverage.json', 'utf8'));
              const pct = data.totals.percent_covered.toFixed(1);
              const covered = data.totals.covered_lines;
              const total = data.totals.num_statements;
              coverageText = `Lines: ${pct}% (${covered}/${total} statements)`;
              status = parseFloat(pct) >= threshold ? '✅' : '❌';
            } catch (e) {
              coverageText = 'Coverage report unavailable';
            }

            const comment = `## 🐍 Python SDK Coverage Report

            | Component | Coverage | Status |
            |-----------|----------|--------|
            | Python SDK | ${coverageText} | ${status} |

            **Minimum Required Coverage:** ${threshold}%
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  build:
    runs-on: ubuntu-latest
    needs: [test-and-coverage, test-python-sdk]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            sdk/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
          npm ci --prefix sdk

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Build SDK
        run: npm run build --prefix sdk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python SDK
        run: |
          pip install build
          python -m build
        working-directory: python-sdk
